# 官方 SDK 坐标适配；没有覆盖项时自动采用官方通道顺序、sign=1、offset=0。
# 关节模型范围来自官方 BPX URDF，不代表固件硬限矩或实际可用范围。
# 只读窗口/录制/回放不要求填写身份或完成对齐确认。
[identity]
serial_number = ""
robot_model = "BPX"
firmware_version = ""

[alignment]
# 在窗口核对 SDK 姿态、关节与训练模型一致后，运动部署前确认一次。
# 这不是软件自动校准，也不会调用 setZeroPositionsFlag。
verified = false

[imu]
# SDK 姿态四元数 xyzw；默认按机体到世界解释，首次接入核对物理姿态。
quaternion_frame = "body_to_world"
sensor_to_body = [1, 0, 0, 0, 1, 0, 0, 0, 1]
gyro_bias = [0, 0, 0]

[odometry]
# 当前 450 维 Actor 不使用基座线速度。
verified = false

# 只有确认实际不一致时才添加覆盖项；无需逐关节手动测量。
