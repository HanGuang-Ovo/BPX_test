<text x="55" y="535" font-size="27" fill="#e8eef6" font-weight="400">反馈列有数值，只能证明已读到反馈；不能证明模型已加载或输入完整。</text>
<text x="55" y="585" font-size="25" fill="#65d9c7" font-weight="400">先读底部状态：策略关闭、文件缺失、维度不符、IMU 缺失或过期，处理方式不同。</text>
<text x="55" y="641" font-size="26" fill="#f9c578" font-weight="700">不要把 “—” 当作 0，也不要用放宽超时掩盖缺失反馈。</text>
