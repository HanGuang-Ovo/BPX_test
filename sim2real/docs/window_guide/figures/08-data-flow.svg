<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="960" viewBox="0 0 1600 960">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#7dd3c7"/></marker></defs>
<rect width="1600" height="960" fill="#0d1622"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#e8eef6">
<text x="48" y="61" font-size="38" font-weight="700">图 8｜从反馈到预览目标的数据流</text>
<text x="48" y="100" font-size="23" fill="#a4b7cc">每个关节角 q 是一个标量；姿态四元数是另一个 4 元数组，不能混用。</text>
<rect x="50" y="150" width="425" height="150" rx="16" fill="#19283a" stroke="#65d9c7" stroke-width="2"/>
<text x="72" y="189" font-size="28" fill="#65d9c7" font-weight="700">SDK 原始反馈</text>
<text x="72" y="229" font-size="23" fill="#e8eef6" font-weight="400">关节 / IMU / 运动状态 / 步态</text>
<text x="72" y="263" font-size="23" fill="#e8eef6" font-weight="400">SDK 只读反馈；不发送运动命令</text>
<rect x="550" y="150" width="470" height="150" rx="16" fill="#19283a" stroke="#65d9c7" stroke-width="2"/>
<text x="572" y="189" font-size="28" fill="#65d9c7" font-weight="700">当前配置转换</text>
<text x="572" y="229" font-size="23" fill="#e8eef6" font-weight="400">索引重排 + sign / offset</text>
<text x="572" y="263" font-size="23" fill="#e8eef6" font-weight="400">IMU 安装旋转 / gyro_bias</text>
<rect x="1100" y="150" width="450" height="150" rx="16" fill="#19283a" stroke="#f9c578" stroke-width="2"/>
<text x="1122" y="189" font-size="28" fill="#f9c578" font-weight="700">官方 q 对照支路</text>
<text x="1122" y="229" font-size="23" fill="#e8eef6" font-weight="400">按官方索引直接读取</text>
<text x="1122" y="263" font-size="23" fill="#e8eef6" font-weight="400">用于检查通道是否对应</text>
<path d="M475,225 L540,225" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M475,175 H510 V130 H1325 V140" fill="none" stroke="#f9c578" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="385" width="690" height="170" rx="16" fill="#19283a" stroke="#65d9c7" stroke-width="2"/>
<text x="72" y="424" font-size="28" fill="#65d9c7" font-weight="700">观测与历史</text>
<text x="72" y="464" font-size="23" fill="#e8eef6" font-weight="400">角速度 + 重力 + command + 相对默认角</text>
<text x="72" y="498" font-size="23" fill="#e8eef6" font-weight="400">关节速度 + 上一次预览 action</text>
<text x="72" y="532" font-size="23" fill="#e8eef6" font-weight="400">45 维单帧 × H=10，按项展开 → 450 维</text>
<path d="M785,300 L785,345" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M785,345 L395,345" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M395,345 L395,375" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="830" y="385" width="720" height="170" rx="16" fill="#19283a" stroke="#65d9c7" stroke-width="2"/>
<text x="852" y="424" font-size="28" fill="#65d9c7" font-weight="700">自动路由与当前模型推理</text>
<text x="852" y="464" font-size="23" fill="#e8eef6" font-weight="400">状态 + 电脑手柄 → 共用路由 / 限变化率</text>
<text x="852" y="498" font-size="23" fill="#e8eef6" font-weight="400">Stand 或 Walk；STOPPING 继续用 Walk</text>
<text x="852" y="532" font-size="23" fill="#e8eef6" font-weight="400">只推理选中模型，得到 12 维原始 action</text>
<path d="M740,470 L820,470" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="660" width="690" height="170" rx="16" fill="#19283a" stroke="#f9c578" stroke-width="2"/>
<text x="72" y="699" font-size="28" fill="#f9c578" font-weight="700">策略 q：模型目标角</text>
<text x="72" y="739" font-size="23" fill="#e8eef6" font-weight="400">q_target = q_default + 0.5 × action</text>
<text x="72" y="773" font-size="23" fill="#e8eef6" font-weight="400">不做实机接管混合，不限幅，不执行</text>
<rect x="830" y="660" width="720" height="170" rx="16" fill="#19283a" stroke="#f9c578" stroke-width="2"/>
<text x="852" y="699" font-size="28" fill="#f9c578" font-weight="700">SDK 目标：转换回 SDK 坐标</text>
<text x="852" y="739" font-size="23" fill="#e8eef6" font-weight="400">q_sdk_target[S] = sign × (q_target − offset)</text>
<text x="852" y="773" font-size="23" fill="#e8eef6" font-weight="400">仅显示 / 记录；不会调用 setJointCommand</text>
<path d="M1190,555 L1190,605" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1190,605 L395,605" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M395,605 L395,648" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M740,745 L820,745" fill="none" stroke="#7dd3c7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="50" y="901" font-size="27" fill="#fdaf77" font-weight="700">目标−反馈 = 策略 q − 当前 q；因为目标未执行，这个差值不等于闭环跟踪误差。</text>
</g></svg>