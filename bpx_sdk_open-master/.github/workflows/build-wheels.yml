name: Build wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build-wheels:
    name: Build ${{ matrix.os }} ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
          - os: windows-2022
            arch: AMD64
          - os: macos-14
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: python scripts/build_wheels.py --cibuildwheel --out-dir dist/wheels

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpx-sdk-open-wheels-${{ matrix.os }}
          path: dist/wheels/*.whl
          if-no-files-found: error
